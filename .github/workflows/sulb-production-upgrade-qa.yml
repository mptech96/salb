name: SULB affected release closure and adapters
on:
  push:
    branches: [codex/sulb-complete-rc-20261027]
    paths:
      - 'backend/app/Support/ReleaseWriteFence.php'
      - 'backend/app/Http/Middleware/EnforceReleaseWriteFence.php'
      - 'backend/app/Providers/AppServiceProvider.php'
      - 'backend/bootstrap/app.php'
      - 'ops/sulb-rc/*qualification*'
      - 'ops/sulb-rc/test-production-schema-gate.php'
      - 'ops/sulb-rc/check-approval.php'
      - 'ops/sulb-rc/*approved*'
      - 'ops/sulb-rc/record-history-approvals.php'
      - 'ops/sulb-rc/test-financial-delegate.php'
      - 'ops/sulb-rc/accounting-forms-ar.md'
      - 'ops/sulb-rc/*write-fence*'
      - 'ops/sulb-rc/*release-fence*'
      - 'ops/sulb-rc/release-process-fence.php'
      - 'ops/sulb-rc/*pool*'
      - 'backend/app/Support/ReleaseRuntimeConfig.php'
      - 'ops/sulb-rc/*backup*'
      - 'ops/sulb-rc/*receipt*'
      - 'ops/sulb-rc/*derived*'
      - 'ops/sulb-rc/*runtime*'
      - 'ops/sulb-rc/release-activate.php'
      - 'ops/sulb-rc/release-postcheck.php'
      - 'ops/sulb-rc/rollback-policy.php'
      - 'ops/sulb-rc/test-recovery-policy.php'
      - 'ops/sulb-rc/test-writer-profile.php'
      - 'ops/sulb-rc/*writer-signoff-policy.php'
      - 'ops/sulb-rc/*writer-window*'
      - 'ops/sulb-rc/test-writer-source-facts.*'
      - 'ops/sulb-rc/writer-signoff-instructions-ar.md'
      - 'ops/sulb-rc/test-writer-signoff-fixture.php'
      - 'ops/sulb-rc/*writer-review-context.php'
      - 'ops/sulb-rc/*writer-linkage.php'
      - 'ops/sulb-rc/trusted-release-application.php'
      - 'ops/sulb-rc/release-app-control.php'
      - 'ops/sulb-rc/test-deployment-orchestration.py'
      - 'ops/sulb-rc/test-fence-account-qa.php'
      - 'ops/sulb-rc/deploy-reviewed-release.sh'
      - 'ops/sulb-rc/production-upgrade*'
      - 'ops/sulb-rc/production-upgrade/**'
      - 'ops/sulb-rc/test-production-upgrade*'
      - '.github/workflows/sulb-production-upgrade-qa.yml'
permissions:
  contents: read
jobs:
  changed-scope:
    runs-on: ubuntu-24.04
    outputs:
      pool_only: ${{ steps.scope.outputs.pool_only }}
      delegate_only: ${{ steps.scope.outputs.delegate_only }}
      window_only: ${{ steps.scope.outputs.window_only }}
      qualification_only: ${{ steps.scope.outputs.qualification_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,subprocess
          allowed={'ops/sulb-rc/pool-binding.py','ops/sulb-rc/release-process-fence.php','ops/sulb-rc/test-pool-include-policy.py','docs/erp-baseline/release-readiness-20261024.md','ops/sulb-rc/release.json','.github/workflows/sulb-production-upgrade-qa.yml'}
          before=os.environ['BEFORE'];after=os.environ['AFTER']
          result=subprocess.run(['git','diff','--name-only','-z',before,after],stdout=subprocess.PIPE)
          files=set(result.stdout.decode().strip('\0').split('\0'))
          only=result.returncode==0 and bool(files) and files<=allowed
          delegate_allowed={'ops/sulb-rc/record-history-approvals.php','ops/sulb-rc/test-financial-delegate.php','ops/sulb-rc/accounting-forms-ar.md','ops/sulb-rc/release.json','docs/erp-baseline/release-readiness-20261024.md','.github/workflows/sulb-production-upgrade-qa.yml'}
          delegate_only=result.returncode==0 and bool(files) and files<=delegate_allowed and not only
          window_allowed={'ops/sulb-rc/writer-window-policy.php','ops/sulb-rc/writer-window-prepare.php','ops/sulb-rc/test-writer-window-policy.php','ops/sulb-rc/test-writer-window-files.php','ops/sulb-rc/test-writer-source-facts.php','ops/sulb-rc/test-writer-source-facts.py','ops/sulb-rc/writer-signoff-policy.php','ops/sulb-rc/release-fence-evidence.php','ops/sulb-rc/release-process-fence.php','ops/sulb-rc/writer-signoff-instructions-ar.md','docs/erp-baseline/release-readiness-20261024.md','.github/workflows/sulb-production-upgrade-qa.yml'}
          window_only=result.returncode==0 and bool(files) and files<=window_allowed and not only and not delegate_only
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('pool_only='+str(only).lower()+'\ndelegate_only='+str(delegate_only).lower()+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('window_only='+str(window_only).lower()+'\n')
          qualification_allowed={'ops/sulb-rc/release.json','ops/sulb-rc/check-approval.php','ops/sulb-rc/release-qualification.php','ops/sulb-rc/inspect-approved-history.php','ops/sulb-rc/test-release-qualification.php','ops/sulb-rc/test-production-schema-gate.php','docs/erp-baseline/release-readiness-20261024.md','.github/workflows/sulb-production-upgrade-qa.yml'}
          qualification_only=result.returncode==0 and bool(files) and files<=qualification_allowed and not (only or delegate_only or window_only)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('qualification_only='+str(qualification_only).lower()+'\n')
          PY
  upgrade:
    needs: changed-scope
    if: needs.changed-scope.outputs.pool_only != 'true' && needs.changed-scope.outputs.delegate_only != 'true' && needs.changed-scope.outputs.window_only != 'true' && needs.changed-scope.outputs.qualification_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.4'
          extensions: pdo_mysql, sodium, bcmath, mbstring, dom, xml, fileinfo, zip
          tools: composer:v2
          coverage: none
      - name: New adapter contracts without database
        run: php ops/sulb-rc/test-production-upgrade-contracts.php
      - name: New executor dependencies only
        run: composer install --working-dir=backend --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: New accounting policy and application fence only
        run: |
          php ops/sulb-rc/test-approved-history-policy.php
          sudo php ops/sulb-rc/test-approval-audit.php
          php ops/sulb-rc/test-write-fence.php
          php ops/sulb-rc/test-write-fence-integration.php
          php ops/sulb-rc/test-release-fence-evidence.php
          php ops/sulb-rc/test-writer-signoff-policy.php
          php ops/sulb-rc/test-writer-window-policy.php
          python3 ops/sulb-rc/test-writer-source-facts.py
          sudo --preserve-env=GITHUB_ACTIONS php ops/sulb-rc/test-writer-window-files.php
          php ops/sulb-rc/test-writer-review-context.php
          php ops/sulb-rc/test-writer-linkage.php
          python3 ops/sulb-rc/test-history-stage.py
          php ops/sulb-rc/test-runtime-config.php
          php ops/sulb-rc/test-recovery-policy.php
          sudo --preserve-env=GITHUB_ACTIONS php ops/sulb-rc/test-writer-profile.php
          php ops/sulb-rc/test-release-backup-contract.php
          php ops/sulb-rc/test-backup-receipt.php
          php ops/sulb-rc/test-asset-backup.php
          python3 ops/sulb-rc/test-pool-include-policy.py
          python3 ops/sulb-rc/test-pool-binding.py
          php ops/sulb-rc/test-idle-pool.php
          php -l ops/sulb-rc/release-process-fence.php
          bash -n ops/sulb-rc/deploy-reviewed-release.sh
          python3 ops/sulb-rc/test-deployment-orchestration.py
      - name: Owned Percona for NEW executor only
        run: |
          set -euo pipefail
          data="/var/lib/mysql/sulb-shipment-$(openssl rand -hex 16)"
          echo "SULB_HISTORY_QA_DATADIR=$data" >> "$GITHUB_ENV"
          docker run -d --name sulb-upgrade-qa --memory 512m --cpus 1 --pids-limit 128 \
            -p 127.0.0.1:3339:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_ROOT_HOST=% \
            percona/percona-server@sha256:eaa4cf955f8a01a43faa6ef656bf8fb69a17c17c278a3b0514212291ca0448b1 \
            --datadir="$data" --port=3306 --bind-address=0.0.0.0 --mysqlx=0 --skip-log-bin --innodb-buffer-pool-size=64M
          for n in $(seq 1 90); do
            if docker exec sulb-upgrade-qa mysqladmin ping -h127.0.0.1 --silent >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: NEW owned-server account lock and existing-session semantics
        run: php ops/sulb-rc/test-fence-account-qa.php
      - name: NEW production executor 18 adapters, original row preservation and tenant FK
        run: php -d memory_limit=512M ops/sulb-rc/test-production-upgrade.php
      - name: New approved history engine with independent company4
        run: php -d memory_limit=512M ops/sulb-rc/test-approved-backfill.php
      - name: Revised unprivileged full frontend build with build-time dev tools
        working-directory: frontend
        env:
          NODE_ENV: production
          SULB_QA_UOM: '0'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:9/api
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);if(a<20||(a===20&&b<9))process.exit(78)'
          npm ci --include=dev --no-audit --no-fund
          npm run build
      - name: Stop owned QA container only
        if: always()
        run: docker rm -f sulb-upgrade-qa >/dev/null 2>&1 || true

  deployment-runtime85:
    needs: changed-scope
    if: needs.changed-scope.outputs.pool_only != 'true' && needs.changed-scope.outputs.delegate_only != 'true' && needs.changed-scope.outputs.window_only != 'true' && needs.changed-scope.outputs.qualification_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.5'
          extensions: pdo_mysql, sodium, bcmath, mbstring, dom, xml, fileinfo, zip
          tools: composer:v2
          coverage: none
      - name: Changed deployment orchestration only, fake toolchain and no production
        run: |
          python3 ops/sulb-rc/test-pool-include-policy.py
          python3 ops/sulb-rc/test-pool-binding.py
          php ops/sulb-rc/test-idle-pool.php
          php -l ops/sulb-rc/release-process-fence.php
          bash -n ops/sulb-rc/deploy-reviewed-release.sh
          python3 ops/sulb-rc/test-deployment-orchestration.py
      - name: Locked production dependencies on PHP 8.5, without application scripts
        run: |
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          composer check-platform-reqs --working-dir=backend --no-dev
          find backend/app backend/database/migrations ops/sulb-rc/production-upgrade -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/sulb-runtime85-lint.txt
          php ops/sulb-rc/test-production-upgrade-contracts.php

  pool-include-guard-only:
    needs: changed-scope
    if: needs.changed-scope.outputs.pool_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.5'
          coverage: none
      - name: Changed include policy only, no application or database
        run: |
          python3 ops/sulb-rc/test-pool-include-policy.py
          python3 -m py_compile ops/sulb-rc/pool-binding.py
          php -l ops/sulb-rc/release-process-fence.php
          php -r 'require "ops/sulb-rc/release-process-fence.php"; $e=new ReleasePoolIncludeFailure("RELEASE_CONFIG_INCLUDE_OUTSIDE_ROOT",["scope"=>"nginx_global"],["requested_path"=>"SYNTHETIC_PRIVATE_PATH"]); if($e->safeContext!==["scope"=>"nginx_global"]||str_contains(json_encode($e->safeContext),"SYNTHETIC_PRIVATE_PATH"))exit(1); echo "PASS private/safe include context separation\n";'

  financial-delegate-only:
    needs: changed-scope
    if: needs.changed-scope.outputs.delegate_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.5'
          coverage: none
      - name: New explicit delegate-role policy only, no old application or database tests
        run: |
          php -l ops/sulb-rc/record-history-approvals.php
          php ops/sulb-rc/test-financial-delegate.php

  writer-window-only:
    needs: changed-scope
    if: needs.changed-scope.outputs.window_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Affected writer qualification and fence contracts only; no database or application tests
        run: |
          php -l ops/sulb-rc/writer-window-policy.php
          php -l ops/sulb-rc/writer-window-prepare.php
          php -l ops/sulb-rc/release-process-fence.php
          php ops/sulb-rc/test-writer-window-policy.php
          python3 ops/sulb-rc/test-writer-source-facts.py
          php ops/sulb-rc/test-writer-signoff-policy.php
          php ops/sulb-rc/test-release-fence-evidence.php
          php ops/sulb-rc/test-idle-pool.php
          sudo --preserve-env=GITHUB_ACTIONS php ops/sulb-rc/test-writer-window-files.php

  qualification:
    needs: changed-scope
    if: needs.changed-scope.outputs.qualification_only == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - name: Changed qualification bindings and pre-DDL metadata guard only
        run: |
          php -l ops/sulb-rc/inspect-approved-history.php
          php -l ops/sulb-rc/check-approval.php
          php ops/sulb-rc/test-release-qualification.php
          php ops/sulb-rc/test-production-schema-gate.php
          set +e
          php ops/sulb-rc/check-approval.php --status
          result=$?
          set -e
          test "$result" -eq 78
